<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bảng điểm sinh viên</title>

<style>

table{
  border-collapse: collapse;
  margin-top:20px;
}

td,th{
  border:1px solid black;
  padding:8px;
  text-align:center;
}

.weak{
  background-color:yellow;
}

.controls{
  margin-top:10px;
}

</style>

</head>

<body>

<h2>Quản lý điểm sinh viên</h2>

<input id="name" placeholder="Họ tên">
<input id="score" placeholder="Điểm">
<button id="addBtn">Thêm</button>

<div class="controls">
<input id="search" placeholder="Tìm theo tên...">

<select id="rankFilter">
<option value="all">Tất cả</option>
<option value="Giỏi">Giỏi</option>
<option value="Khá">Khá</option>
<option value="Trung bình">Trung bình</option>
<option value="Yếu">Yếu</option>
</select>
</div>

<table>

<thead>
<tr>
<th>STT</th>
<th>Họ tên</th>
<th id="scoreHeader" style="cursor:pointer">Điểm</th>
<th>Xếp loại</th>
<th>Thao tác</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

<p id="stats"></p>

<script src="bai1-2.js"></script>

</body>
</html>
